<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Starforce Simulator</title>

<link rel="stylesheet" href="styles.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="app-shell">

<header class="site-header">
<div class="container header-inner">

<div class="brand">
Starforce Simulator
</div>

</div>
</header>


<main class="main">
<div class="container main-layout">

<!-- LEFT PANEL -->
<div class="card">

<h2 class="card-title">Simulation Settings</h2>

<form class="sf-form">

<div class="form-row">
<label>Item Level</label>
<input id="level" type="number" value="150">
</div>

<div class="form-row">
<label>Start Star</label>
<input id="startStar" type="number" value="12">
</div>

<div class="form-row">
<label>Target Star</label>
<input id="targetStar" type="number" value="17">
</div>

<div class="form-row">
<label>Simulation Runs</label>
<input id="tries" type="number" value="5000">
</div>

<div class="form-row">
<label>MVP</label>
<select id="mvp">
<option>No</option>
<option>Silver</option>
<option>Gold</option>
<option>Diamond+</option>
</select>
</div>

<div class="form-row form-row--full">
<fieldset>

<legend>Options</legend>

<div class="checkbox-group">

<label>
<input type="checkbox" id="safe">
Safeguard
</label>

<label>
<input type="checkbox" id="boomEvent">
30% Boom Reduction
</label>

<label>
<input type="checkbox" id="mesoEvent">
30% Meso Discount
</label>

</div>

</fieldset>
</div>

<div class="form-actions">
<button class="btn-primary" type="submit">
Run Simulation
</button>
</div>

</form>

</div>


<!-- RIGHT PANEL -->
<div class="card info-card">

<h2 class="card-title">Results</h2>

<div id="results"></div>

<hr class="divider">

<canvas id="mesoChart"></canvas>

<hr class="divider">

<canvas id="boomChart"></canvas>

</div>

</div>
</main>

<footer class="site-footer">
Starforce Simulator
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
