<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starforce Simulator</title>
  <link rel="stylesheet" href="css main.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">Starforce Simulator</div>
        <nav class="top-nav">
          <a href="#" class="active">Simulator</a>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="container main-layout">
        <section class="card">
          <h2 class="card-title">Simulation Settings</h2>

          <form class="sf-form">
            <div class="form-row">
              <label for="level">Item Level</label>
              <input id="level" type="number" min="1" value="150" />
            </div>

            <div class="form-row">
              <label for="startStar">Start Star</label>
              <input id="startStar" type="number" min="0" max="29" value="12" />
            </div>

            <div class="form-row">
              <label for="targetStar">Target Star</label>
              <input id="targetStar" type="number" min="1" max="30" value="17" />
            </div>

            <div class="form-row">
              <label for="tries">Simulation Runs</label>
              <input id="tries" type="number" min="1" value="1000" />
            </div>

            <div class="form-row">
              <label for="mvp">MVP</label>
              <select id="mvp">
                <option>No</option>
                <option>Silver</option>
                <option>Gold</option>
                <option>Diamond+</option>
              </select>
            </div>

            <div class="form-row form-row--full">
              <fieldset>
                <legend>Options</legend>
                <div class="checkbox-group">
                  <label><input type="checkbox" id="safe" /> Safeguard</label>
                  <label><input type="checkbox" id="boomEvent" /> 30% Boom Reduction</label>
                  <label><input type="checkbox" id="mesoEvent" /> 30% Meso Discount</label>
                </div>
              </fieldset>
            </div>

            <div class="form-actions">
              <button class="btn-primary" type="submit">Run Simulation</button>
            </div>
          </form>
        </section>

        <aside class="card info-card">
          <h2 class="card-title">Results</h2>

          <div id="results" class="results-placeholder">
            <h3>Waiting for simulation</h3>
            <p>Enter your settings and click Run Simulation.</p>
          </div>

          <hr class="divider" />

          <div class="form-row--full">
            <canvas id="mesoChart"></canvas>
          </div>

          <hr class="divider" />

          <div class="form-row--full">
            <canvas id="boomChart"></canvas>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      Starforce Simulator
    </footer>
  </div>

  <script src="code.js"></script>
</body>
</html>
